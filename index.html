<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1510">
  <title>Server #327 Territory Allocation</title>
  <style>
    :root{
      --bg:#0c1510;--card:#16231b;--card2:#1c2c22;--line:#385140;
      --text:#f3f6f4;--muted:#adbbb1;--gold:#ffe04b;--green:#71ef83;
      --orange:#ff9849;--pink:#ed77ff;--danger:#ff7d68;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
    button{font:inherit}
    header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px max(14px,env(safe-area-inset-left));background:#09110dcc;border-bottom:1px solid #2e4436;backdrop-filter:blur(12px)}
    .brand h1{margin:0;font-size:clamp(18px,2.4vw,27px);letter-spacing:.02em}
    .brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .lang{display:flex;padding:3px;background:#24362b;border:1px solid #405a49;border-radius:10px}
    .lang button{border:0;background:transparent;color:#b9c4bc;padding:8px 13px;border-radius:7px;font-weight:800;cursor:pointer}
    .lang button.active{background:#fff;color:#132017}
    main{max-width:1440px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px #0004}
    .map-card{padding:10px;min-width:0}
    .map-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 10px}
    .status{display:flex;align-items:center;gap:7px;color:#c5d0c8;font-size:12px}
    .status-dot{width:8px;height:8px;border-radius:50%;background:#70ef83;box-shadow:0 0 12px #70ef83}
    .tools{display:flex;gap:5px}
    .tools button{width:36px;height:34px;border:1px solid #4b6754;background:#22342a;color:#fff;border-radius:8px;cursor:pointer;font-weight:900;font-size:18px}
    .tools button:hover{background:#2d4537}
    .viewport{position:relative;overflow:auto;max-height:calc(100vh - 118px);background:#07100b;border-radius:10px;overscroll-behavior:contain}
    .map-stage{position:relative;width:100%;min-width:820px;line-height:0;transform-origin:top left}
    #mapImage{display:block;width:100%;height:auto;aspect-ratio:888/739;background:#3f6548;opacity:0;transition:opacity .25s}
    #mapImage.ready{opacity:1}
    .map-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .claim{fill-opacity:.14;stroke-width:6;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 4px #000);pointer-events:all;cursor:pointer}
    .claim-gld{fill:var(--gold);stroke:var(--gold)}
    .claim-hnb{fill:var(--green);stroke:var(--green)}
    .pin{pointer-events:all;cursor:pointer;filter:drop-shadow(0 3px 3px #0008)}
    .pin .halo{fill:none;stroke-width:2;animation:pulse 2s infinite;transform-box:fill-box;transform-origin:center}
    .pin text{font:900 9px Inter,Arial,sans-serif;fill:#101510;dominant-baseline:middle;text-anchor:middle}
    @keyframes pulse{0%{opacity:.9;transform:scale(.7)}75%,100%{opacity:0;transform:scale(1.6)}}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:#31553d;color:#e7eee9;font-weight:800;line-height:1.4;text-align:center;z-index:2}
    .spinner{width:34px;height:34px;border-radius:50%;border:3px solid #ffffff35;border-top-color:#fff;margin:0 auto 9px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .map-note{padding:9px 3px 0;color:#aebbb2;font-size:11px;line-height:1.45}
    aside{align-self:start;position:sticky;top:77px;display:grid;gap:12px}
    .panel{padding:14px}
    .panel h2{font-size:16px;margin:0 0 10px}
    .panel h3{font-size:13px;color:#d6dfd9;margin:15px 0 8px;text-transform:uppercase;letter-spacing:.08em}
    .level-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .level{padding:7px 4px;border-radius:7px;text-align:center;font-size:12px;font-weight:900;border:1px solid #ffffff28}
    .lv1{background:#426a49}.lv2{background:#c19e35}.lv3{background:#b35b04}.lv4{background:#5d2165}.lv5{background:#1f579c}.lv6{background:#c84c19}
    .entry{position:relative;padding:10px 10px 10px 14px;background:var(--card2);border:1px solid #334b3c;border-radius:9px;margin:7px 0;line-height:1.35;font-size:13px}
    .entry:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:9px 0 0 9px;background:var(--accent)}
    .entry strong{display:block;margin-bottom:3px;font-size:13px}
    .entry small{display:block;color:var(--muted);margin-top:3px}
    .gld{--accent:var(--gold)}.hnb{--accent:var(--green)}.fln{--accent:var(--orange)}.lass{--accent:var(--pink)}
    .coord{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#dbe5de}
    .pending{padding:9px 10px;border:1px dashed #59705f;border-radius:8px;color:#b7c3bb;font-size:12px;line-height:1.45;margin-top:8px}
    .bonus-grid{display:grid;gap:5px;font-size:12px;color:#cbd5ce}
    .bonus-grid div{display:flex;justify-content:space-between;gap:10px;padding:5px 7px;background:#1b2a21;border-radius:6px}
    .bonus-grid span:last-child{color:#fff;text-align:right}
    .credit{color:#8fa095;font-size:10px;margin-top:10px;line-height:1.4}
    .tooltip{position:fixed;z-index:100;display:none;max-width:260px;padding:9px 11px;background:#07100bf2;border:1px solid #607766;border-radius:9px;box-shadow:0 10px 28px #000a;font-size:12px;line-height:1.45;pointer-events:none}
    .tooltip b{font-size:13px}
    @media(max-width:980px){
      main{grid-template-columns:1fr}
      aside{position:static;grid-template-columns:1fr 1fr}
      .viewport{max-height:none}
    }
    @media(max-width:680px){
      header{align-items:flex-start}
      main{padding:6px}
      .map-card{padding:6px}
      .map-stage{min-width:760px}
      aside{grid-template-columns:1fr}
      .status{max-width:65%;line-height:1.25}
    }
  </style>
</head>
<body>
<header>
  <div class="brand">
    <h1>LAST ASYLUM · SERVER #327</h1>
    <p id="subtitle"></p>
  </div>
  <div class="lang" aria-label="Language">
    <button id="enBtn" type="button" onclick="setLanguage('en')">EN</button>
    <button id="ruBtn" type="button" onclick="setLanguage('ru')">RU</button>
  </div>
</header>
<main>
  <section class="card map-card">
    <div class="map-toolbar">
      <div class="status"><span class="status-dot"></span><span id="statusText"></span></div>
      <div class="tools" aria-label="Zoom controls">
        <button type="button" title="Zoom out" onclick="changeZoom(-0.15)">−</button>
        <button type="button" title="Reset zoom" onclick="resetZoom()">↺</button>
        <button type="button" title="Zoom in" onclick="changeZoom(0.15)">+</button>
      </div>
    </div>
    <div class="viewport" id="viewport">
      <div class="map-stage" id="mapStage">
        <div class="loading" id="loading"><div><div class="spinner"></div><span id="loadingText"></span></div></div>
        <img id="mapImage" alt="Server 327 territory map">
        <svg class="map-overlay" viewBox="0 0 888 739" aria-label="Alliance requests overlay">
          <!-- Exact territory outlines, extracted from the supplied map. -->
          <path class="claim claim-gld" data-marker="fox" d="M0 338H105V397H86L85 419H0Z"/>
          <path class="claim claim-gld" data-marker="lark" d="M205 338L204 342L202 340L110 341V396L108 400L104 402H90V417H174L175 379L212 378V351L206 350L203 347V345L205 344Z"/>
          <path class="claim claim-hnb" data-marker="coastal" d="M398 519H371L367 525L320 526V535L322 538L335 537L339 541V596L366 597L399 595L400 553L398 545Z"/>

          <g class="pin" data-marker="fox" transform="translate(36 389)">
            <circle class="halo" r="18" stroke="#ffe04b"/><circle r="13" fill="#ffe04b" stroke="#101510" stroke-width="3"/><text y="1">GLD</text>
          </g>
          <g class="pin" data-marker="lark" transform="translate(121 393)">
            <circle class="halo" r="18" stroke="#ffe04b"/><circle r="13" fill="#ffe04b" stroke="#101510" stroke-width="3"/><text y="1">GLD</text>
          </g>
          <g class="pin" data-marker="coastal" transform="translate(349 569)">
            <circle class="halo" r="18" stroke="#71ef83"/><circle r="13" fill="#71ef83" stroke="#101510" stroke-width="3"/><text y="1">HnB</text>
          </g>
        </svg>
      </div>
    </div>
    <div class="map-note" id="mapNote"></div>
  </section>

  <aside>
    <section class="card panel">
      <h2 id="confirmedTitle"></h2>
      <div class="level-legend">
        <div class="level lv1">Lv. 1</div><div class="level lv2">Lv. 2</div><div class="level lv3">Lv. 3</div>
        <div class="level lv4">Lv. 4</div><div class="level lv5">Lv. 5</div><div class="level lv6">Lv. 6</div>
      </div>
      <div class="entry gld" data-card="fox"></div>
      <div class="entry gld" data-card="lark"></div>
      <div class="entry hnb" data-card="coastal"></div>
      <div class="pending" id="exactOnly"></div>
    </section>

    <section class="card panel">
      <h2 id="otherTitle"></h2>
      <div class="entry fln" id="flnEntry"></div>
      <div class="entry hnb" id="hnbEntry"></div>
      <div class="entry lass" id="lassEntry"></div>
      <h3 id="bonusTitle"></h3>
      <div class="bonus-grid" id="bonusGrid"></div>
      <div class="credit" id="credit"></div>
    </section>
  </aside>
</main>
<div class="tooltip" id="tooltip"></div>
<script>
  const MAP_PARTS = 4;
  const I18N = {
    en: {
      subtitle: 'Exact source geometry · live diplomatic allocation layer',
      status: 'Exact map base loaded from the supplied kingdom layout',
      loading: 'Loading exact map…',
      confirmedTitle: 'Placed on the map',
      otherTitle: 'Requests awaiting exact coordinates',
      exactOnly: 'Only coordinate-confirmed territories are drawn on the map. Nothing is placed by guesswork.',
      mapNote: 'Bright outlines show the whole requested territory. Pins use the game coordinates supplied in negotiations. Scroll or zoom to inspect the original borders.',
      bonusTitle: 'Original map terms',
      credit: 'Base geometry follows the map supplied by the user. Original map credit shown in the source: AllMightyP.',
      statusRequested: 'Requested', statusNext: 'Next target', level: 'Level', coords: 'Coordinates',
      fox: {name:'Fox Den', alliance:'GLD', level:1, coords:'X:41 · Y:485', status:'Requested'},
      lark:{name:'Lark Lane', alliance:'GLD', level:2, coords:'X:140 · Y:479', status:'Requested'},
      coastal:{name:'Coastal Citadel', alliance:'HnB', level:3, coords:'X:402 · Y:235', status:'Next target'},
      fln:'<strong>FLN · Fallen</strong>Keep current Lv.1 territories and current Lv.2 territory.<small>Conditional: Lv.1 territories can be released if FLN receives both Lv.3 and Lv.4.</small>',
      hnb:'<strong>HnB · HoneyBadgers</strong>Dry Well, Frostleaf, Irongate, Stardust and one Lv.3: Cloudtop or Cliffside.<small>Exact coordinates were not supplied for these requests. HnB does not plan further advancement.</small>',
      lass:'<strong>Lass · PornH</strong>No additional territory request recorded yet.<small>The alliance’s current location is visible in the game screenshots, but no new claim has been submitted.</small>',
      bonuses:[['Timber Output','Timber production'],['Grain Output','Grain production'],['Herb Output','Herb production'],['Gather Spd','Gathering speed'],['Training Spd','Training speed'],['Building Spd','Building speed'],['Research Spd','Research speed']]
    },
    ru: {
      subtitle: 'Точная исходная геометрия · слой дипломатического распределения',
      status: 'Основа карты загружена из присланной схемы королевства',
      loading: 'Загружаю точную карту…',
      confirmedTitle: 'Нанесено на карту',
      otherTitle: 'Заявки без точных координат',
      exactOnly: 'На карту нанесены только территории с подтверждёнными координатами. Ничего не размещается наугад.',
      mapNote: 'Яркая рамка показывает всю заявленную территорию. Маркеры установлены по игровым координатам из переговоров. Прокручивайте и увеличивайте карту, чтобы рассмотреть исходные границы.',
      bonusTitle: 'Перевод терминов исходной карты',
      credit: 'Геометрия сохранена по присланной пользователем карте. Автор, указанный на исходной схеме: AllMightyP.',
      statusRequested: 'Заявлено', statusNext: 'Следующая цель', level: 'Уровень', coords: 'Координаты',
      fox: {name:'Лисья нора', alliance:'GLD', level:1, coords:'X:41 · Y:485', status:'Заявлено'},
      lark:{name:'Жаворонковый переулок', alliance:'GLD', level:2, coords:'X:140 · Y:479', status:'Заявлено'},
      coastal:{name:'Прибрежная цитадель', alliance:'HnB', level:3, coords:'X:402 · Y:235', status:'Следующая цель'},
      fln:'<strong>FLN · Fallen</strong>Сохранить текущие территории ур.1 и текущую территорию ур.2.<small>Условие: от территорий ур.1 готовы отказаться, если FLN получит одновременно ур.3 и ур.4.</small>',
      hnb:'<strong>HnB · HoneyBadgers</strong>Сухой колодец, Frostleaf, Irongate, Stardust и одна территория ур.3: Cloudtop или Cliffside.<small>Для этих заявок точные координаты пока не присланы. Дальше HnB продвигаться не планирует.</small>',
      lass:'<strong>Lass · PornH</strong>Дополнительных заявок на территории пока нет.<small>Текущее расположение альянса видно на игровых скриншотах, но новая заявка не подавалась.</small>',
      bonuses:[['Timber Output','Добыча древесины'],['Grain Output','Добыча зерна'],['Herb Output','Добыча трав'],['Gather Spd','Скорость сбора'],['Training Spd','Скорость обучения'],['Building Spd','Скорость строительства'],['Research Spd','Скорость исследований']]
    }
  };

  let language = new URLSearchParams(location.search).get('lang') || localStorage.getItem('server327-language') || 'en';
  let zoomLevel = 1;
  const markerData = ['fox','lark','coastal'];

  function renderCard(key){
    const d = I18N[language][key];
    return `<strong>[${d.alliance}] ${d.name}</strong>${I18N[language].level} ${d.level} · ${d.status}<small><span class="coord">${d.coords}</span></small>`;
  }

  function setLanguage(lang){
    language = lang === 'ru' ? 'ru' : 'en';
    localStorage.setItem('server327-language', language);
    document.documentElement.lang = language;
    document.getElementById('enBtn').classList.toggle('active', language === 'en');
    document.getElementById('ruBtn').classList.toggle('active', language === 'ru');
    const t = I18N[language];
    document.getElementById('subtitle').textContent = t.subtitle;
    document.getElementById('statusText').textContent = t.status;
    document.getElementById('loadingText').textContent = t.loading;
    document.getElementById('confirmedTitle').textContent = t.confirmedTitle;
    document.getElementById('otherTitle').textContent = t.otherTitle;
    document.getElementById('exactOnly').textContent = t.exactOnly;
    document.getElementById('mapNote').textContent = t.mapNote;
    document.getElementById('bonusTitle').textContent = t.bonusTitle;
    document.getElementById('credit').textContent = t.credit;
    markerData.forEach(k => document.querySelector(`[data-card="${k}"]`).innerHTML = renderCard(k));
    document.getElementById('flnEntry').innerHTML = t.fln;
    document.getElementById('hnbEntry').innerHTML = t.hnb;
    document.getElementById('lassEntry').innerHTML = t.lass;
    document.getElementById('bonusGrid').innerHTML = t.bonuses.map(([a,b]) => `<div><span>${a}</span><span>${b}</span></div>`).join('');
  }

  function showTooltip(event,key){
    const d = I18N[language][key];
    const tip = document.getElementById('tooltip');
    tip.innerHTML = `<b>[${d.alliance}] ${d.name}</b><br>${I18N[language].level} ${d.level} · ${d.status}<br><span class="coord">${d.coords}</span>`;
    tip.style.display = 'block';
    const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(innerWidth - w - 8, event.clientX + pad) + 'px';
    tip.style.top = Math.min(innerHeight - h - 8, event.clientY + pad) + 'px';
  }
  function hideTooltip(){ document.getElementById('tooltip').style.display = 'none'; }

  function applyZoom(){
    document.getElementById('mapStage').style.width = `${zoomLevel * 100}%`;
  }
  function changeZoom(delta){ zoomLevel = Math.max(.75, Math.min(2.2, zoomLevel + delta)); applyZoom(); }
  function resetZoom(){ zoomLevel = 1; applyZoom(); document.getElementById('viewport').scrollTo({left:0,top:0,behavior:'smooth'}); }

  document.querySelectorAll('[data-marker]').forEach(el => {
    const key = el.dataset.marker;
    el.addEventListener('mousemove', e => showTooltip(e,key));
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('click', () => document.querySelector(`[data-card="${key}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}));
  });

  async function loadMap(){
    try{
      const parts = await Promise.all(Array.from({length:MAP_PARTS},(_,i) => fetch(`assets/map-${i+1}.txt?v=2`).then(r => {
        if(!r.ok) throw new Error(`Map part ${i+1} failed`);
        return r.text();
      })));
      const img = document.getElementById('mapImage');
      img.onload = () => { img.classList.add('ready'); document.getElementById('loading').style.display='none'; };
      img.src = 'data:image/webp;base64,' + parts.join('');
    }catch(error){
      document.getElementById('loading').innerHTML = `<div>${error.message}</div>`;
    }
  }

  setLanguage(language);
  loadMap();
</script>
</body>
</html>
