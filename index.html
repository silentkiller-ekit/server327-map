/div><script>const T={en:{note:'Working live allocation map. Colored fields are territory levels; bright alliance borders show known requests or negotiated targets.',details:'<b>FLN</b> — keep current Lv.1 and Lv.2. If Lv.3 + Lv.4 are obtained, FLN will abandon Lv.1.<br><b>HnB</b> — Dry Well, Frostleaf, Irongate, Stardust; one Lv.3 (Cloudtop OR Cliffside) negotiable. Coastal Citadel Lv.3 is their next target. No further advance planned.<br><b>GLD</b> — Fox Den Lv.1 (X:41 Y:485) and Lark Lane Lv.2 (X:140 Y:479). Open to trading.<br><b>Lass</b> — current position known; no additional request yet.'},ru:{note:'Рабочая карта распределения в реальном времени. Цвет поля показывает уровень территории, яркая рамка альянса — известную заявку или согласуемую цель.',details:'<b>FLN</b> — сохранить текущие территории ур.1 и ур.2. Если получат ур.3 + ур.4, откажутся от ур.1.<br><b>HnB</b> — Сухой колодец, Frostleaf, Irongate, Stardust; одна территория ур.3 (Cloudtop ИЛИ Cliffside) обсуждается. Прибрежная цитадель ур.3 — следующая цель. Дальше продвигаться не планируют.<br><b>GLD</b> — Лисья нора ур.1 (X:41 Y:485) и Жаворонковый переулок ур.2 (X:140 Y:479). Готовы к обмену.<br><b>Lass</b> — текущая позиция известна; дополнительных заявок пока нет.'}};function lang(l){document.documentElement.lang=l;document.getElementById('en').classList.toggle('on',l==='en');document.getElementById('ru').classList.toggle('on',l==='ru');document.getElementById('sub').textContent=l==='en'?'Interactive diplomatic territory map':'Интерактивная дипломатическая карта территорий';document.getElementById('note').textContent=T[l].note;document.getElementById('details').innerHTML=T[l].details;document.querySelectorAll('[data-en]').forEach(x=>x.textContent=x.dataset[l]);localStorage.setItem('mapLang',l)}lang(localStorage.getItem('mapLang')||'en');</script></body></html>
